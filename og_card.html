<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1200px;height:630px;overflow:hidden;font-family:'Inter',sans-serif;}
  .card{width:1200px;height:630px;background:#A97F78;display:grid;
    grid-template-columns:1fr 470px;position:relative;overflow:hidden;}
  .card::after{content:"";position:absolute;left:-70px;bottom:-120px;width:300px;height:300px;
    border-radius:50%;border:1px solid rgba(251,248,246,.22);}
  .txt{padding:64px 40px 60px 68px;display:flex;flex-direction:column;justify-content:center;
    position:relative;z-index:2;}
  .eyebrow{font-size:15px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#EBD9AE;}
  h1{font-size:64px;font-weight:600;letter-spacing:-.03em;line-height:1.02;color:#FBF8F6;margin:22px 0 0;}
  .cn{margin:24px 0 0;color:#F0E2C4;font-size:27px;font-weight:500;}
  .cn .han{letter-spacing:.14em;}
  .cn .en{letter-spacing:.01em;font-size:.82em;}
  .rule{width:74px;height:2px;background:#C7A66A;margin:30px 0 0;}
  .foot{margin:26px 0 0;color:#F3E6E2;font-size:20px;font-weight:500;}
  .shot{position:relative;overflow:hidden;background:#D8CEC3;}
  .shot img{width:100%;height:100%;object-fit:cover;}
  .shot::before{content:"";position:absolute;inset:0;z-index:2;
    box-shadow:inset 42px 0 46px -30px rgba(169,127,120,.85);}
</style></head>
<body>
  <div class="card">
    <div class="txt">
      <span class="eyebrow">Mdm Ling Bakery</span>
      <h1>Gifts that outlive the season</h1>
      <p class="cn"><span class="han">花月情长</span> <span class="en">· A Bond in Lasting Bloom</span></p>
      <div class="rule"></div>
      <p class="foot">Mid-Autumn 2026 · 14 keepsakes</p>
    </div>
    <div class="shot"><img src="assets/painted-garden-tin.webp"></div>
  </div>
</body></html>
